apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-project-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-project-demo
  template:
    metadata:
      labels:
        app: k8s-project-demo
    spec:
      containers:
        - name: k8s-project-demo
          image: 970605359639.dkr.ecr.ap-south-1.amazonaws.com/k8s-project-demo:89a2676214a3eaf95ba7877e4ea161fa726426b0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
      imagePullSecrets:
        - name: ecr-secret
